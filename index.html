<style>
/* Eén losse pagina: de stijl staat hier, zodat style.css offline kan blijven. */
:root{
  --bg:#fdfcfa; --surface:#f5f2ed; --text:#242018; --muted:#6b6358;
  --accent:#9c5a3c; --line:#e4ded4;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#17150f; --surface:#211e17; --text:#f0ebe2; --muted:#a79e90;
    --accent:#d08a63; --line:#322d24;

}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;display:grid;place-items:center;
  padding:2rem 1rem;background:var(--bg);color:var(--text);
  font:400 clamp(1rem,.96rem + .2vw,1.08rem)/1.65 Inter,system-ui,sans-serif;
}
main{text-align:center;max-width:34rem}
.merk{width:4.5rem;height:4.5rem;margin-inline:auto;color:var(--accent)}
h1{
  font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.12;
  letter-spacing:-.015em;margin:1.6rem 0 0;
  font-size:clamp(1.8rem,1.3rem + 2.4vw,2.9rem);
}
.eyebrow{
  display:block;font-size:.72rem;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);margin-top:1.4rem;
}
p{color:var(--muted);margin:1.1rem 0 0;text-wrap:pretty}
hr{border:0;border-top:1px solid var(--line);margin:2.5rem auto 0;width:4rem}
</style>
